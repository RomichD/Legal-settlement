name: Build Android APK

on:
  push:
    branches:
      -android-Legal-settlement
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получение файлов репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Установка зависимостей
        run: npm install

      - name: Создание Android-платформы
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Синхронизация HTML с Android-проектом
        run: npx cap sync android

      - name: Сборка debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Сохранение APK
        uses: actions/upload-artifact@v4
        with:
          name: legal-calculator-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
